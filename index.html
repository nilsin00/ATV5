
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <style>
        /* Configurações gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8eef7, #d5e2f2);
            color: #263445;
            padding: 35px 15px;
        }

        /* Centralização */
        .container {
            width: 100%;
            max-width: 720px;
            margin: auto;
        }

        .titulo {
            text-align: center;
            margin-bottom: 22px;
        }

        .titulo h1 {
            color: #172b4d;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #596779;
            font-size: 15px;
        }

        /* Formulário */
        form {
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(23, 43, 77, 0.12);
            border: 1px solid #d7e0eb;
        }

        .campo {
            margin-bottom: 19px;
        }

        .campo > label,
        .legenda {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #263b59;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #bdc9d8;
            border-radius: 7px;
            background: #fbfcfe;
            color: #263445;
            font-size: 15px;
            outline: none;
            transition: 0.25s;
        }

        /* Efeito focus */
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2463a6;
            box-shadow: 0 0 0 3px rgba(36, 99, 166, 0.16);
            background: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        /* Opções */
        .opcoes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 22px;
            padding: 5px 0;
        }

        .opcoes label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-weight: normal;
            color: #3d4b5e;
            cursor: pointer;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: #2463a6;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Upload de foto */
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed #9aabc0;
            border-radius: 7px;
            background: #f7f9fc;
            cursor: pointer;
        }

        .ajuda {
            display: block;
            margin-top: 6px;
            color: #718096;
            font-size: 12px;
        }

        /* Botões */
        .botoes {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px 18px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .enviar {
            background: #2463a6;
            color: white;
        }

        .enviar:hover {
            background: #174778;
            transform: translateY(-2px);
        }

        .limpar {
            background: #e5eaf1;
            color: #263b59;
        }

        .limpar:hover {
            background: #cfd8e5;
            transform: translateY(-2px);
        }

        button:focus-visible {
            outline: 3px solid #f0a23b;
            outline-offset: 3px;
        }

        /* Rodapé */
        .rodape {
            text-align: center;
            margin-top: 18px;
            color: #657386;
            font-size: 13px;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .titulo h1 {
                font-size: 25px;
            }

            form {
                padding: 22px 17px;
            }

            .botoes {
                flex-direction: column;
            }

            .opcoes {
                gap: 12px 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="titulo">
            <h1>Formulário de Cadastro</h1>
            <p>Preencha seus dados para realizar o cadastro.</p>
        </header>

        <form action="#" method="post" enctype="multipart/form-data">

            <!-- Nome -->
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome completo" required>
            </div>

            <!-- E-mail -->
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                    placeholder="exemplo@email.com" required>
            </div>

            <!-- Senha -->
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                    placeholder="Crie uma senha"
                    minlength="6" required>
                <small class="ajuda">
                    A senha deve ter pelo menos 6 caracteres.
                </small>
            </div>

            <!-- Data de nascimento -->
            <div class="campo">
                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento"
                    name="nascimento" required>
            </div>

            <!-- Curso -->
            <div class="campo">
                <label for="curso">Curso</label>
                <select id="curso" name="curso" required>
                    <option value="">Selecione seu curso</option>
                    <option value="informatica">Informática</option>
                    <option value="desenvolvimento-web">Desenvolvimento Web</option>
                    <option value="administracao">Administração</option>
                    <option value="design">Design</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <!-- Sexo -->
            <fieldset class="campo" style="border: 0;">
                <legend class="legenda">Sexo</legend>

                <div class="opcoes">
                    <label>
                        <input type="radio" name="sexo"
                            value="feminino" required>
                        Feminino
                    </label>

                    <label>
                        <input type="radio" name="sexo"
                            value="masculino">
                        Masculino
                    </label>

                    <label>
                        <input type="radio" name="sexo"
                            value="nao-informar">
                        Prefiro não informar
                    </label>
                </div>
            </fieldset>

            <!-- Interesses -->
            <fieldset class="campo" style="border: 0;">
                <legend class="legenda">Interesses</legend>

                <div class="opcoes">
                    <label>
                        <input type="checkbox" name="interesses"
                            value="tecnologia">
                        Tecnologia
                    </label>

                    <label>
                        <input type="checkbox" name="interesses"
                            value="programacao">
                        Programação
                    </label>

                    <label>
                        <input type="checkbox" name="interesses"
                            value="jogos">
                        Jogos
                    </label>

                    <label>
                        <input type="checkbox" name="interesses"
                            value="design">
                        Design
                    </label>

                    <label>
                        <input type="checkbox" name="interesses"
                            value="esportes">
                        Esportes
                    </label>
                </div>
            </fieldset>

            <!-- Comentários -->
            <div class="campo">
                <label for="comentarios">Comentários</label>
                <textarea id="comentarios" name="comentarios"
                    placeholder="Escreva aqui seus comentários..."></textarea>
            </div>

            <!-- Upload de foto -->
            <div class="campo">
                <label for="foto">Upload de foto</label>
                <input type="file" id="foto" name="foto"
                    accept="image/*">

                <small class="ajuda">
                    Selecione uma imagem do seu dispositivo.
                </small>
            </div>

            <!-- Botões -->
            <div class="botoes">
                <button type="submit" class="enviar">
                    Enviar formulário
                </button>

                <button type="reset" class="limpar">
                    Limpar campos
                </button>
            </div>

        </form>

        <p class="rodape">
            Atividade de HTML e CSS — Formulário
        </p>

    </main>

</body>
</html>
